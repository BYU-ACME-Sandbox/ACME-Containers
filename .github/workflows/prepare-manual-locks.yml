name: Prepare manual locks

on:
  workflow_dispatch:
    inputs:
      targets:
        description: all, core, dev, or comma-separated course targets
        required: true
        default: all
        type: string
      upgrade:
        description: Allow macOS transitive packages to upgrade within declared bounds
        required: true
        default: false
        type: boolean

concurrency:
  group: prepare-manual-locks
  cancel-in-progress: false

# The public uv-locks repository is cloned read-only.  This workflow never
# stores a cross-repository credential and never pushes outside this repo.
permissions:
  contents: read

env:
  MANUAL_LOCKS_REPOSITORY: https://github.com/BYU-ACME-Sandbox/uv-locks.git

jobs:
  generate:
    name: Generate and verify ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Seed from public manual-lock repository
        shell: bash
        run: |
          rm -rf generated/manual-environments
          git clone --depth 1 "$MANUAL_LOCKS_REPOSITORY" generated/manual-environments

      - name: Read tool versions
        id: config
        shell: bash
        run: |
          echo "uv_version=$(python3 -c 'import json; print(json.load(open("config/images.json"))["uv_version"])')" >> "$GITHUB_OUTPUT"
          echo "python_version=$(python3 -c 'import json; print(json.load(open("config/images.json"))["python_version"])')" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ steps.config.outputs.uv_version }}
          enable-cache: true
          cache-dependency-glob: |
            requirements/**/*.in
            requirements/locks/**/*.txt
            config/images.json

      - name: Install exact Python
        shell: bash
        run: uv python install '${{ steps.config.outputs.python_version }}'

      - name: Generate platform locks
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          UPGRADE: ${{ inputs.upgrade }}
        run: |
          args=(generate "$TARGETS" --platform '${{ matrix.platform }}')
          if [[ "$UPGRADE" == 'true' ]]; then
            args+=(--upgrade)
          fi
          ./manual-locks "${args[@]}"

      - name: Verify native installation
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: ./manual-locks verify "$TARGETS" --platform '${{ matrix.platform }}'

      - name: Package generated platform files
        shell: bash
        run: |
          mkdir -p staged
          while IFS= read -r -d '' file; do
            mkdir -p "staged/$(dirname "$file")"
            cp "$file" "staged/$file"
          done < <(find generated/manual-environments -type f \
            \( -name '${{ matrix.platform }}.txt' -o -name 'metadata.json' \) -print0)
          tar -C staged -czf 'manual-${{ matrix.platform }}.tar.gz' generated/manual-environments

      - name: Upload generated platform files
        uses: actions/upload-artifact@v7
        with:
          name: manual-${{ matrix.platform }}
          path: manual-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 2

  finalize:
    name: Assemble manual-lock update
    runs-on: ubuntu-24.04
    needs: generate

    steps:
      - uses: actions/checkout@v7

      - name: Check out public manual-lock repository
        shell: bash
        run: |
          rm -rf generated/manual-environments
          git clone --depth 1 "$MANUAL_LOCKS_REPOSITORY" generated/manual-environments

      - name: Download generated locks
        uses: actions/download-artifact@v8
        with:
          pattern: manual-*
          path: artifacts
          merge-multiple: true

      - name: Merge platform artifacts
        shell: bash
        run: |
          for archive in artifacts/manual-*.tar.gz; do
            tar -xzf "$archive" -C .
          done

          # Intel macOS is unsupported. Remove any stale lock that may have
          # been produced by an older version of the manual-lock tooling.
          find generated/manual-environments \
            -type f -name 'macos-amd64.txt' -delete

          # Keep the public output repository clean on macOS workstations.
          find generated/manual-environments -type f -name '.DS_Store' -delete
          printf '.DS_Store\n' > generated/manual-environments/.gitignore

      - name: Validate merged manual locks
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: ./manual-locks validate "$TARGETS" --platform all

      - name: Run repository tests
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          ./acme-containers validate --allow-missing-locks

      - name: Create local publication files
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          git -C generated/manual-environments add -A
          git -C generated/manual-environments diff --cached --binary \
            > "$GITHUB_WORKSPACE/manual-locks-update.patch"
          git -C generated/manual-environments reset --quiet

          tar --exclude='.git' \
            -C generated/manual-environments \
            -czf "$GITHUB_WORKSPACE/manual-environments.tar.gz" .

          cat > "$GITHUB_WORKSPACE/PUBLISH-MANUAL-LOCKS.txt" <<EOF
          The native manual-lock jobs passed for: $TARGETS

          To publish this update from a local ACME-Containers checkout:

            git -C uv-locks pull --ff-only
            git -C uv-locks apply --check /path/to/manual-locks-update.patch
            git -C uv-locks apply /path/to/manual-locks-update.patch
            git -C uv-locks add -A
            git -C uv-locks commit -m "Update ACME manual environment locks"
            git -C uv-locks push origin main

          The nested repository uses your normal local Git/GitHub authentication.
          No cross-repository token is stored in ACME-Containers.
          EOF

      - name: Upload ready-to-publish manual locks
        uses: actions/upload-artifact@v7
        with:
          name: manual-locks-ready-to-publish
          path: |
            manual-locks-update.patch
            manual-environments.tar.gz
            PUBLISH-MANUAL-LOCKS.txt
          if-no-files-found: error
          retention-days: 7
